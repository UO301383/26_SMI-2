<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>26-SMI-2 | Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .chat-shell {
      max-width: 920px;
      height: calc(100vh - 120px);
    }

    #chat-messages {
      height: 100%;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .chat-message {
      max-width: 75%;
    }

    .chat-message.own {
      margin-left: auto;
    }
  </style>
</head>
<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>
    <div id="nav-auth" class="d-flex gap-2"></div>
  </nav>

  <div id="chat-status" class="alert alert-warning d-none m-3"></div>

  <main class="container py-4">
    <section class="chat-shell card border-0 shadow-sm mx-auto">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h5 mb-0">Chat en directo</h1>
          <small class="text-muted">Mensajería para usuarios registrados</small>
        </div>
        <span id="chat-connection" class="badge text-bg-secondary">Conectando</span>
      </div>

      <div id="chat-messages" class="card-body d-flex flex-column gap-3"></div>

      <form id="chat-form" class="card-footer bg-white d-flex gap-2">
        <input id="chat-input" class="form-control" type="text" maxlength="500" autocomplete="off" placeholder="Escribe un mensaje..." required>
        <button class="btn btn-danger" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
