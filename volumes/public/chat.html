<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>26-SMI-2 | Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=chat-redesign" />
</head>
<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>
    <div id="nav-auth" class="d-flex gap-2"></div>
  </nav>

  <main class="container py-4 chat-page">
    <section class="chat-hero mb-4">
      <div>
        <p class="chat-eyebrow mb-2">Mensajería instantánea</p>
        <h1 class="chat-title mb-2">Sala global del servicio</h1>
        <p class="chat-subtitle mb-0">Conversación en tiempo real entre usuarios registrados mediante eventos del backend.</p>
      </div>
      <a href="index.html" class="btn btn-light fw-bold">Volver al catálogo</a>
    </section>

    <div id="chat-status" class="alert alert-warning d-none mb-3"></div>

    <section class="chat-shell mx-auto">
      <div class="chat-header d-flex justify-content-between align-items-center">
        <div>
          <h2 class="h5 mb-0">Chat en directo</h2>
          <small class="text-muted">Mensajes sincronizados con Server-Sent Events</small>
        </div>
        <span id="chat-connection" class="badge text-bg-secondary">Conectando</span>
      </div>

      <div id="chat-messages" class="chat-messages d-flex flex-column gap-3"></div>

      <form id="chat-form" class="chat-form d-flex gap-2">
        <input id="chat-input" class="form-control" type="text" maxlength="500" autocomplete="off" placeholder="Escribe un mensaje..." required>
        <button class="btn btn-danger fw-bold" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js?v=chat-redesign"></script>
</body>
</html>
