<!DOCTYPE html>                          <!-- Tipo de documento HTML5 -->
<html lang="es">                         <!-- Idioma español -->
<head>
  <meta charset="UTF-8" />              <!-- Codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Responsive -->
  <title>26-SMI-2</title>                <!-- Título en la pestaña del navegador -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" /> <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="css/style.css" /> <!-- CSS personalizado -->
</head>
<body>
<!-- Barra de navegación -->
 <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top"> 
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>

    <form id="busqueda-form"class="d-flex" role="search" style="width: 40%">
        <input id="busqueda-input" class="form-control me-2" type="search" placeholder="Buscar videos..." aria-label="Search" />
        <button class="btn btn-outline-danger" type="submit">Buscar</button>
    </form>
    <div id="nav-auth" class="d-flex gap-2"></div>
 </nav>

 <!-- Contenido principal  -->
  <main class="container py-4">
    <div class="text-center mb-5">
      <button id="btn-subir" class="btn btn-danger px-5 py-3 fs-5 fw-bold rounded-pill shadow">Subir Video</button>
    </div>
    <div id="video-grid" class ="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"> <!--se cargan los videos dinámicamente con index.js -->
    </div>
  </main>
  <div class="modal fade" id="modal-subida" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Subir nuevo video</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="upload-titulo" class="form-label">Título del video</label>
            <input type="text" class="form-control" id="upload-titulo" placeholder="Ingrese el título del video">
          </div>
          <div class="mb-3">
            <label for="upload-descripcion" class="form-label">Descripción del video</label>
            <textarea class="form-control" id="upload-descripcion" rows="2" placeholder="Ingrese una descripción para el video"></textarea>
          </div>
          <div class="mb-3">
            <label for="upload-archivo" class="form-label">Archivo de video</label>
            <input class="form-control" type="file" id="upload-archivo" accept="video/*">
          </div>
          <div id="subida-error" class="text-danger small"></div>
          <div id="subida-progreso" style="display: none;">
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%">
                Subiendo...
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="btn-confirmar-subida" type="button" class="btn btn-danger">Subir Video</button>
        </div>
      </div>
    </div>
  </div>
    <!-- scripts (orden importante) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap -->
  <script src="js/api.js"></script>   <!--define BASE_URL y funciones fetch -->
  <script src="js/auth.js"></script>  <!--api.js -->
  <script src="js/index.js"></script> <!--lógica de esta página, depende de los dos anteriores -->
</body>
</html>
