<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reproductor - 26-SMI-2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>
    <div id="nav-auth" class="d-flex gap-2"></div>
  </nav>

  <main class="container py-4">
    <div id="player-error" class="alert alert-danger d-none"></div>

    <div class="row g-4">
      <section class="col-lg-8">
        <div class="ratio ratio-16x9 bg-dark rounded overflow-hidden mb-3">
          <video id="video-player" controls playsinline class="w-100 h-100"></video>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <button id="btn-modo-mp4" class="btn btn-danger btn-sm">Modo MP4</button>
          <button id="btn-modo-dash" class="btn btn-outline-danger btn-sm">Modo DASH</button>
        </div>

        <h1 id="video-title" class="h3 fw-bold mb-2">Cargando vídeo...</h1>
        <p id="video-meta" class="text-muted mb-2"></p>
        <p id="video-description" class="mb-4"></p>

        <section>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Comentarios</h2>
          </div>

          <div id="comment-form-wrapper" class="card p-3 mb-3">
            <label for="comment-input" class="form-label">Añadir comentario</label>
            <textarea id="comment-input" class="form-control mb-2" rows="3" placeholder="Escribe tu comentario..."></textarea>
            <div class="d-flex justify-content-between align-items-center">
              <span id="comment-error" class="text-danger small"></span>
              <button id="btn-comment" class="btn btn-danger btn-sm">Publicar</button>
            </div>
          </div>

          <div id="comments-list" class="d-grid gap-3"></div>
        </section>
      </section>

      <aside class="col-lg-4">
        <div class="card p-3">
          <h2 class="h5 mb-3">Siguiente paso</h2>
          <p class="text-muted small mb-2">Desde aquí podremos enlazar con playlist y reproducción secuencial.</p>
          <a href="playlist.html" class="btn btn-outline-danger btn-sm">Ir a playlist</a>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
