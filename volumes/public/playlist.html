<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist - 26-SMI-2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=playlist-redesign" />
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>
    <div id="nav-auth" class="d-flex gap-2"></div>
  </nav>

  <main class="container py-4 playlist-page">
    <div id="playlist-error" class="alert alert-danger d-none"></div>

    <div class="row g-4">
      <section class="col-lg-8">
        <div class="playlist-hero">
          <p class="playlist-eyebrow mb-2">Reproducción continua</p>
          <h1 class="playlist-title mb-3">Playlist automática de videos procesados.</h1>
          <p class="playlist-subtitle mb-4">La lista se genera con los videos disponibles en backend y abre cada elemento en el reproductor con MP4/DASH.</p>
          <div class="d-flex flex-wrap gap-2">
            <a id="playlist-first-link" href="index.html" class="btn btn-light fw-bold">Abrir primer vídeo</a>
            <a href="index.html" class="btn btn-outline-light fw-bold">Volver al catálogo</a>
          </div>
        </div>
      </section>

      <aside class="col-lg-4">
        <div class="playlist-list-shell">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <p class="playlist-eyebrow text-muted mb-1">Cola</p>
              <h2 class="h6 mb-0">Lista de reproducción</h2>
            </div>
            <span id="playlist-count" class="playlist-count-badge"></span>
          </div>

          <div id="playlist-list" class="d-grid gap-3"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/playlist.js?v=playlist-redesign"></script>
</body>
</html>
