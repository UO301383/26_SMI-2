<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist - 26-SMI-2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
    <a class="navbar-brand fw-bold text-danger" href="index.html">26-SMI-2</a>
    <div id="nav-auth" class="d-flex gap-2"></div>
  </nav>

  <main class="container py-4">
    <div id="playlist-error" class="alert alert-danger d-none"></div>

    <div class="row g-4">
      <section class="col-lg-8">
        <h1 class="h4 fw-bold mb-2">Playlist</h1>
        <p class="text-muted mb-4">Selecciona un vídeo para abrirlo en el reproductor.</p>
      </section>

      <aside class="col-lg-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h6 mb-0">Lista de reproducción</h2>
          <span id="playlist-count" class="text-muted small"></span>
        </div>

        <div id="playlist-list" class="d-grid gap-3"></div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/playlist.js"></script>
</body>
</html>
