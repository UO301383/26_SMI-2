<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-smi-2 perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
        <a class="navbar-brand fw-bold text-danger" href="index.html">26-smi-2</a>
        <div id="nav-auth" class="d-flex gap-2">
        </div>
    </nav>
    <!-- contenido principal del perfil -->
    <main class="container py-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="position-relative" style="width:100px; height:100px;">
                <img id="avatar-usuario" src="" alt="Avatar del usuario" class="rounded-circle w-100 h-100" style="object-fit: cover;">
            </div>
        </div>

        <div>
            <h4 id="nombre-usuario" class="mb-0 fw-bold"></h4>
            <p id="username-usuario" class="text-muted mb-0"></p>
        </div>

        <!-- botón editar perfil -->
        <button id="btn-editar-perfil" class="btn btn-outline-danger mt-3">Editar perfil</button>
    </main>

    <!-- videos del usuario -->
    <h5 class="mb-3">Mis videos</h5>
    <div id="videos-usuario-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
    <div class="modal fade" id="modal-editar-perfil" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editar-nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editar-nombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="editar-avatar" class="form-label">Foto de perfil</label>
                        <input type="file" class="form-control" id="editar-avatar" accept="image/*">
                    </div>
                    <div id="editar-error" class="text-danger small"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-editar">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>     <!-- BASE_URL y funciones fetch -->
    <script src="js/auth.js"></script>    <!-- Gestión de sesión -->
    <script src="js/profile.js"></script> <!-- Lógica de esta página -->
</body>
</html>
