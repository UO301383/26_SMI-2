<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-smi-2 perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
        <a class="navbar-brand fw-bold text-danger" href="index.html">26-smi-2</a>
        <div id="nav-auth" class="d-flex gap-2">
            <!-- No hay buscador en el perfil, asi que se quita -->
        </div>
    </nav>
    <!-- contenido principal del perfil -->
    <main class="container py-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="position-relative" style="width:100px; height:100px;">
                <img id="avatar-usuario" src="" alt="Avatar del usuario" class="rounded-circle w-100 h-100" style="object-fit: cover;">
                <button id="btn-cambiar-icono" class="btn btn-danger btn-sm position-absolute bottom-0 end-0" style="object-fit:cover;" style="font-size:0.7rem; padding: 2px 6px;">+</button>
            </div>
        </div>

        <!-- archivo input oculto para seleccionar nueva imagen de avatar -->
        <input type="file" id="input-avatar" accept="image/*" style="display:none;">

        <div>
            <h4 id="nombre-usuario" class="mb-0 fw-bold"></h4>
            <p id="username-usuario" class="text-muted mb-0"></p>
        </div>

        <!-- botón editar perfil -->
        <button id="btn-editar-perfil" class="btn btn-outline-danger mt-3">Editar perfil</button>
    </main>

    <!-- videos del usuario -->
     <h5 class="mb-3">Mis videos</h5>
     <div id="videos-usuario-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <!-- las tarjetas de video se generarán con profile.js-->
     </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>     <!-- BASE_URL y funciones fetch -->
    <script src="js/auth.js"></script>    <!-- Gestión de sesión -->
    <script src="js/profile.js"></script> <!-- Lógica de esta página -->
</body>
</html>
