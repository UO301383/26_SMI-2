<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-smi-2 perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=profile-redesign">
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom px-3 sticky-top">
        <a class="navbar-brand fw-bold text-danger" href="index.html">26-smi-2</a>
        <div id="nav-auth" class="d-flex gap-2">
        </div>
    </nav>
    <main class="container py-4 profile-page">
        <section class="profile-hero mb-4">
            <div class="profile-cover"></div>
            <div class="profile-card">
                <div class="profile-avatar-wrap">
                    <img id="avatar-usuario" src="" alt="Avatar del usuario" class="profile-avatar d-none">
                    <div id="avatar-iniciales" class="profile-avatar profile-avatar-fallback">U</div>
                </div>
                <div class="profile-info">
                    <p class="profile-eyebrow mb-1">Perfil de usuario</p>
                    <h1 id="nombre-usuario" class="profile-name mb-1"></h1>
                    <p id="username-usuario" class="profile-username mb-0"></p>
                    <div class="profile-actions mt-3">
                        <button id="btn-editar-perfil" class="btn btn-danger">Editar perfil</button>
                        <a href="index.html" class="btn btn-outline-danger">Volver al catálogo</a>
                    </div>
                </div>
                <div class="profile-stats">
                    <span id="contador-videos" class="profile-stat-number">0</span>
                    <span class="profile-stat-label">videos subidos</span>
                </div>
            </div>
        </section>

        <section class="profile-videos-section">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
                <div>
                    <p class="profile-eyebrow mb-1">Contenido propio</p>
                    <h2 class="h4 fw-bold mb-0">Mis videos</h2>
                </div>
            </div>
            <div id="videos-usuario-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
        </section>
    </main>
    <div class="modal fade" id="modal-editar-perfil" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editar-nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editar-nombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="editar-avatar" class="form-label">Foto de perfil</label>
                        <input type="file" class="form-control" id="editar-avatar" accept="image/*">
                    </div>
                    <div id="editar-error" class="text-danger small"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-editar">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>     <!-- BASE_URL y funciones fetch -->
    <script src="js/auth.js"></script>    <!-- Gestión de sesión -->
    <script src="js/profile.js?v=profile-redesign"></script> <!-- Lógica de esta página -->
</body>
</html>
